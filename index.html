<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Subs Counter</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at center, #0a0a0a, #000);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial;
  color: white;
  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  font-size: 26px;
  color: #aaa;
  letter-spacing: 3px;
  font-weight: 300;
}

#subs {
  font-size: 120px;
  color: #00fff0;
  text-shadow: 0 0 20px #00fff0, 0 0 40px #00fff0;
  margin: 20px 0;
  animation: glow 2s infinite;
}

@keyframes glow {
  0% { text-shadow: 0 0 10px #00fff0; }
  50% { text-shadow: 0 0 30px #00fff0; }
  100% { text-shadow: 0 0 10px #00fff0; }
}

#goalText {
  color: #888;
  font-size: 14px;
  letter-spacing: 2px;
}

.bar {
  width: 420px;
  height: 8px;
  background: #111;
  margin: 20px auto;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 10px #00fff0;
}

#fill {
  height: 100%;
  width: 0%;
  background: #00fff0;
  transition: width 1s ease;
  box-shadow: 0 0 15px #00fff0;
}
</style>
</head>

<body>

<div class="container">
  <h1>LIVE SUBSCRIBERS</h1>
  <div id="subs">0</div>

  <div id="goalText">Road to 10,000 Subs</div>

  <div class="bar">
    <div id="fill"></div>
  </div>
</div>

<script>
// 🔴 حط معلوماتك هنا فقط
const API_KEY = "AIzaSyDV6wsuCP5iGrLUFkTOwCA-veseDC2uhNY";
const CHANNEL_ID = "UCCji3rVchUafZT6qxETGIxQ";

let goal = 10000;
let lastSubs = 0;

// 📊 goal system
function updateGoal(subs){

  if(subs >= goal){
    goal *= 2;
  }

  document.getElementById("goalText").innerText =
    "Road to " + goal.toLocaleString() + " Subs";

  let percent = (subs / goal) * 100;
  if(percent > 100) percent = 100;

  document.getElementById("fill").style.width = percent + "%";
}

// 🔢 smooth animation
function animateValue(start, end, duration){
  let startTime = null;

  function step(t){
    if(!startTime) startTime = t;
    let progress = t - startTime;

    let value = Math.floor(start + (end - start) * (progress / duration));

    document.getElementById("subs").innerText = value;

    if(progress < duration){
      requestAnimationFrame(step);
    }
  }

  requestAnimationFrame(step);
}

// 🔥 fetch subs
async function loadSubs(){
  try {
    const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();

    let subs = parseInt(data.items[0].statistics.subscriberCount);

    animateValue(lastSubs, subs, 1200);
    updateGoal(subs);

    lastSubs = subs;

  } catch (e) {
    document.getElementById("subs").innerText = "Error";
  }
}

loadSubs();
setInterval(loadSubs, 5000);
</script>

</body>
</html>
