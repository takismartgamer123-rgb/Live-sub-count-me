<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Stats Real-Time</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #0a0a0a, #000);
  font-family: Arial;
  color: white;
}

/* 🌌 background */
canvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 0;
}

/* 📌 logo */
#logo {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  position: absolute;
  top: 15px;
  left: 15px;
  border: 2px solid #00fff0;
  box-shadow: 0 0 15px #00fff0;
  z-index: 10;
}

/* center */
.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 2;
}

/* title */
h1 {
  font-size: 18px;
  color: #aaa;
  letter-spacing: 3px;
}

/* big number */
#subs {
  font-size: 140px;
  color: #00fff0;
  text-shadow: 0 0 25px #00fff0;
  margin: 10px 0;
}

/* panel */
.panel {
  display: flex;
  gap: 15px;
  justify-content: center;
}

.box {
  background: rgba(0,0,0,0.4);
  border: 1px solid #00fff0;
  box-shadow: 0 0 10px #00fff0;
  padding: 10px 18px;
  border-radius: 10px;
  min-width: 110px;
}

.box h3 {
  margin: 0;
  font-size: 13px;
  color: #aaa;
}

.box p {
  margin: 5px 0 0;
  font-size: 20px;
  color: #00fff0;
}

/* goal bar */
.bar {
  width: 420px;
  height: 8px;
  background: #111;
  margin: 20px auto;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 10px #00fff0;
}

#fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#00fff0,#0088ff);
  transition: width 0.8s ease;
}

/* alert */
#alert {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,255,240,0.15);
  border: 1px solid #00fff0;
  box-shadow: 0 0 20px #00fff0;
  padding: 10px 20px;
  border-radius: 10px;
  display: none;
  z-index: 20;
}
</style>
</head>

<body>

<img id="logo" src="logo.png">

<div id="alert">+1 Subscriber 🎉</div>

<canvas id="particles"></canvas>

<div class="container">

  <h1>LIVE REAL-TIME STATS</h1>

  <div id="subs">0</div>

  <div class="panel">
    <div class="box">
      <h3>SUBS</h3>
      <p id="subsBox">0</p>
    </div>

    <div class="box">
      <h3>VIEWS</h3>
      <p id="viewsBox">0</p>
    </div>

    <div class="box">
      <h3>GOAL</h3>
      <p id="goalBox">10K</p>
    </div>
  </div>

  <div class="bar">
    <div id="fill"></div>
  </div>

</div>

<script>

const API_KEY = "AIzaSyDV6wsuCP5iGrLUFkTOwCA-veseDC2uhNY";
const CHANNEL_ID = "UCCji3rVchUafZT6qxETGIxQ";

let goal = 10000;
let lastSubs = 0;
let loading = false;

/* alert */
function showAlert(){
  const a = document.getElementById("alert");
  a.style.display = "block";
  setTimeout(()=> a.style.display = "none", 1500);
}

/* goal */
function updateGoal(subs){
  if(subs >= goal) goal *= 2;

  document.getElementById("goalBox").innerText = goal.toLocaleString();

  let percent = (subs / goal) * 100;
  if(percent > 100) percent = 100;

  document.getElementById("fill").style.width = percent + "%";
}

/* animate */
function animate(el, start, end, duration){
  let t = null;

  function step(time){
    if(!t) t = time;
    let p = time - t;

    let val = Math.floor(start + (end - start) * (p / duration));

    el.innerText = val;

    if(p < duration) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

/* fetch */
async function load(){

  if(loading) return;
  loading = true;

  try {
    const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();

    let subs = parseInt(data.items[0].statistics.subscriberCount);
    let views = parseInt(data.items[0].statistics.viewCount);

    if(subs !== lastSubs){
      animate(document.getElementById("subs"), lastSubs, subs, 600);
      showAlert();
    }

    document.getElementById("subsBox").innerText = subs.toLocaleString();
    document.getElementById("viewsBox").innerText = views.toLocaleString();

    updateGoal(subs);

    lastSubs = subs;

  } catch(e){
    console.log("error");
  }

  loading = false;
}

load();
setInterval(load, 3000); // 🔥 real-time feel

</script>

</body>
</html>
